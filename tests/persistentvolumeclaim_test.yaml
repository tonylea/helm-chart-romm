suite: PersistentVolumeClaims
release:
  name: romm
templates:
  - templates/persistentvolumeclaim.yaml
tests:
  - it: makes a claim each for resources, assets and the task queue
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: romm-resources
        documentIndex: 0
      - equal:
          path: metadata.name
          value: romm-assets
        documentIndex: 1
      - equal:
          path: metadata.name
          value: romm-redis-data
        documentIndex: 2

  - it: sizes each claim, with the cluster's default class
    asserts:
      - equal:
          path: spec
          value:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi
        documentIndex: 0
      - equal:
          path: spec.resources.requests.storage
          value: 10Gi
        documentIndex: 1
      - equal:
          path: spec.resources.requests.storage
          value: 1Gi
        documentIndex: 2

  - it: names, sizes and classes each claim as given
    set:
      persistence:
        resources:
          claimName: romm-covers
          size: 50Gi
          storageClassName: longhorn
        assets:
          claimName: romm-saves
          size: 20Gi
          storageClassName: fast
        redisData:
          claimName: romm-queue
          size: 2Gi
          storageClassName: slow
    asserts:
      - equal:
          path: metadata.name
          value: romm-covers
        documentIndex: 0
      - equal:
          path: spec.storageClassName
          value: longhorn
        documentIndex: 0
      - equal:
          path: spec.resources.requests.storage
          value: 50Gi
        documentIndex: 0
      - equal:
          path: metadata.name
          value: romm-saves
        documentIndex: 1
      - equal:
          path: spec.storageClassName
          value: fast
        documentIndex: 1
      - equal:
          path: metadata.name
          value: romm-queue
        documentIndex: 2
      - equal:
          path: spec.resources.requests.storage
          value: 2Gi
        documentIndex: 2
